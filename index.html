<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;overflow:hidden}
#hitVignette{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(255,0,0,.08) 68%,rgba(210,0,0,.68) 100%);transition:opacity .04s linear}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:15px;left:15px;pointer-events:none;text-shadow:0 2px 4px #000}
.stat{font-size:18px;margin:7px 0;font-weight:bold}
#minimap{position:fixed;right:18px;top:18px;width:160px;height:160px;border:2px solid white;background:#111b;pointer-events:none}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#101820ee;padding:30px 42px;border:1px solid #6b879b;border-radius:12px;min-width:310px;max-width:90vw}
#message h1{font-size:34px;margin:0 0 12px}
#message p{color:#c5d2dc;line-height:1.5}
#message small{display:block;color:#aab7c1;margin-top:16px;line-height:1.5}
#message a,#credits a{color:#80d8ff}
button{background:#20a6e8;color:white;border:0;border-radius:7px;padding:13px 25px;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#087db9}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:white;text-shadow:0 0 4px black;pointer-events:none}
#bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);font-size:14px;text-shadow:0 2px 4px black;pointer-events:none;white-space:nowrap}
#roundBanner{display:none;position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);padding:20px 45px;background:#07131de8;border:2px solid #61d9ff;border-radius:12px;color:white;font-size:38px;font-weight:900;letter-spacing:3px;text-shadow:0 0 18px #20a6e8;pointer-events:none}
#soundBtn{position:fixed;right:18px;top:190px;padding:9px 13px;font-size:13px}
#credits{position:fixed;right:10px;bottom:7px;font-size:10px;color:#b7c2ca;text-shadow:0 1px 3px black}
</style>
</head>

<div id="bottom">

// ---------------- SOUND SYSTEM ----------------

function initAudio(){
 try{
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(!audioContext&&AudioClass)audioContext=new AudioClass();
  if(audioContext&&audioContext.state==="suspended")audioContext.resume();
 }catch(e){}
}

function tone(startFreq,endFreq,duration,type="triangle",volume=.035,delay=0){
 if(!audioEnabled||!audioContext)return;

 const now=audioContext.currentTime+delay;
 const oscillator=audioContext.createOscillator();
 const gain=audioContext.createGain();

 oscillator.type=type;
 oscillator.frequency.setValueAtTime(startFreq,now);
 oscillator.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),now+duration);

 gain.gain.setValueAtTime(volume,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+duration);

 oscillator.connect(gain);
 gain.connect(audioContext.destination);
 oscillator.start(now);
 oscillator.stop(now+duration+.02);
}

function soundPlayerShot(){
 tone(240,75,.09,"sawtooth",.035);
 tone(100,45,.07,"triangle",.025);
}

function soundEnemyShot(){
 tone(170,75,.11,"square",.018);
}

function soundHit(){
 tone(115,48,.18,"triangle",.055);
}

function soundReload(){
 tone(300,430,.12,"sine",.025);
}

function soundRound(){
 tone(390,520,.16,"sine",.04,0);
 tone(520,690,.18,"sine",.04,.13);
 tone(650,850,.24,"sine",.045,.27);
}

// Each living CPU has its own looping robotic chant, positioned and mixed by distance.
function attachBotVoice(bot){
 const audio=new Audio(BOT_VOICE_SRC);
 audio.loop=true;
 audio.preload="auto";
 audio.volume=1;
 bot.voiceAudio=audio;
 bot.voiceGain=null;
 bot.voicePan=null;
 try{
  if(audioContext){
   const source=audioContext.createMediaElementSource(audio);
   const gain=audioContext.createGain();
   const pan=audioContext.createStereoPanner();
   gain.gain.value=0;
   source.connect(gain);
   gain.connect(pan);
   pan.connect(audioContext.destination);
   bot.voiceGain=gain;
   bot.voicePan=pan;
  }
 }catch(e){/* volume-only fallback below */}
}

function startBotVoices(){
 if(!audioEnabled)return;
 for(const bot of bots){
  if(bot.alive&&bot.voiceAudio){
   bot.voiceAudio.play().catch(()=>{});
  }
 }
}

function stopBotVoices(){
 for(const bot of bots){
  if(bot.voiceAudio){
   bot.voiceAudio.pause();
   bot.voiceAudio.currentTime=0;
  }
  if(bot.voiceGain)bot.voiceGain.gain.value=0;
 }
}

function updateBotVoices(){
 for(const bot of bots){
  if(!bot.voiceAudio)continue;
  const dx=bot.x-player.x;
  const dy=bot.y-player.y;
  const dist=Math.hypot(dx,dy);
  const relative=normalizeAngle(Math.atan2(dy,dx)-player.angle);
  // Full volume nearby, fading smoothly toward silence at long range.
  const level=bot.alive&&audioEnabled?Math.max(0,Math.min(.9,1.02-dist/15)):0;
  if(bot.voiceGain&&audioContext){
   bot.voiceGain.gain.setTargetAtTime(level,audioContext.currentTime,.09);
   bot.voicePan.pan.setTargetAtTime(Math.max(-1,Math.min(1,Math.sin(relative))),audioContext.currentTime,.12);
  }else{
   bot.voiceAudio.volume=level;
  }
  if(!bot.alive||!audioEnabled){
   if(!bot.voiceAudio.paused)bot.voiceAudio.pause();
  }else if(active&&bot.voiceAudio.paused){
   bot.voiceAudio.play().catch(()=>{});
  }
 }
}

document.getElementById("soundBtn").addEventListener("click",()=>{
 audioEnabled=!audioEnabled;
 document.getElementById("soundBtn").textContent=
  audioEnabled?"SOUND: ON":"SOUND: OFF";

 if(audioEnabled){
  initAudio();
  startBotVoices();
 }else{
  for(const bot of bots)if(bot.voiceAudio)bot.voiceAudio.pause();
 }
});

// ---------------- MAP AND PLAYERS ----------------

function makeMap(){
 map=Array.from({length:MAPSIZE},(_,y)=>
  Array.from({length:MAPSIZE},(_,x)=>
   x===0||y===0||x===MAPSIZE-1||y===MAPSIZE-1?1:0
  )
 );

 // A much larger arena with scattered wall clusters and wide routes between them.
 // The open centre guarantees a clear player starting area; clusters never form
 // continuous barriers, so zombies can navigate around them.
 for(let y=3;y<MAPSIZE-3;y+=5){
  for(let x=3;x<MAPSIZE-3;x+=5){
   if(Math.random()<.30)continue;
   const w=1+(Math.random()<.28?1:0);
   const h=1+(Math.random()<.28?1:0);
   const ox=x+Math.floor(Math.random()*2);
   const oy=y+Math.floor(Math.random()*2);
   for(let yy=oy;yy<oy+h;yy++){
    for(let xx=ox;xx<ox+w;xx++){
     // Keep the central spawn zone open and preserve broad connecting lanes.
     if(Math.abs(xx-16)<4&&Math.abs(yy-16)<4)continue;
     if(xx>1&&yy>1&&xx<MAPSIZE-2&&yy<MAPSIZE-2)map[yy][xx]=1;
    }
   }
  }
 }

 // Clear a roomy central starting area.
 for(let y=13;y<=19;y++)for(let x=13;x<=19;x++)map[y][x]=0;
}

function wall(x,y){
 return map[Math.floor(y)]?.[Math.floor(x)]!==0;
}

function spawnBots(){
 stopBotVoices();
 bots=[];
 const spots=[
  [3.5,3.5],[28.5,3.5],[3.5,28.5],[28.5,28.5],
  [16.5,3.5],[16.5,28.5],[3.5,16.5],[28.5,16.5],
  [8.5,5.5],[24.5,7.5],[7.5,24.5],[24.5,24.5]
 ];
 const used=[];

 function findClearSpawn(preferred){
  const [px,py]=preferred;
  const candidates=[];
  for(let y=1;y<MAPSIZE-1;y++)for(let x=1;x<MAPSIZE-1;x++){
   const cx=x+.5, cy=y+.5;
   if(wall(cx,cy))continue;
   if(Math.hypot(cx-player.x,cy-player.y)<9)continue;
   if(used.some(([ux,uy])=>Math.hypot(cx-ux,cy-uy)<2))continue;
   candidates.push({x:cx,y:cy,score:Math.hypot(cx-px,cy-py)});
  }
  candidates.sort((a,b)=>a.score-b.score);
  if(candidates.length)return [candidates[0].x,candidates[0].y];
  return [28.5,28.5];
 }

 for(let i=0;i<Math.min(5+round,spots.length);i++){
  const [x,y]=findClearSpawn(spots[i]);
  used.push([x,y]);

  bots.push({
   x,y,
   health:100,
   angle:Math.PI,
   speed:(.55+Math.random()*.15)*4,
   alive:true,
   hit:0,
   pathTimer:0,
   pathX:player.x,
   pathY:player.y
  });
  attachBotVoice(bots[bots.length-1]);
 }
}

function setUpRound(){
 makeMap();

 player.x=16.5;
 player.y=16.5;
 player.angle=0;
 player.ammo=Infinity;
 player.reloading=false;

 spawnBots();
 paint=[];

 updateHUD();
}

function start(){
 initAudio();
 message.style.display="none";
 active=true;
 betweenRounds=false;
 round=1;
 score=0;
 player.health=100;
 contactDamageCooldown=0;
 setUpRound();
 soundRound();
 startBotVoices();
 lastTime=performance.now();
 requestAnimationFrame(gameLoop);
}

document.getElementById("start").addEventListener("click",start);

function updateHUD(){
 document.getElementById("health").textContent=
  "HEALTH: "+Math.max(0,Math.ceil(player.health));


 document.getElementById("score").textContent="SCORE: "+score;
 document.getElementById("round").textContent="ROUND: "+round;
}

// ---------------- ROUND TRANSITIONS ----------------

function startNextRound(){
 if(!active||betweenRounds)return;

 betweenRounds=true;
 round++;

 const banner=document.getElementById("roundBanner");
 banner.textContent="ROUND "+round;
 banner.style.display="block";

 soundRound();
 updateHUD();

 setTimeout(()=>{
  if(!active)return;

  // Health carries over between rounds; no automatic healing.

  setUpRound();

  betweenRounds=false;
  banner.style.display="none";
  updateHUD();
 },1000);
}

// ---------------- CONTROLS ----------------

function reload(){
 // Infinite ammo: reloading is unnecessary.
 return;
 if(!active||betweenRounds||player.reloading||player.ammo===player.maxAmmo)return;

 player.reloading=true;
 updateHUD();
 soundReload();

 setTimeout(()=>{
  if(!active)return;
  player.ammo=Infinity;
  player.reloading=false;
  updateHUD();
 },1100);
}

canvas.addEventListener("click",()=>{
 if(active&&!locked)canvas.requestPointerLock();
});

document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===canvas;
 // Ignore the first mouse movement after pointer lock changes to prevent camera jumps.
 ignoreNextMouseMove=true;
});

let ignoreNextMouseMove=false;
document.addEventListener("mousemove",e=>{
 if(!locked||!active)return;
 if(ignoreNextMouseMove){ignoreNextMouseMove=false;return;}
 const dx=Math.max(-80,Math.min(80,e.movementX||0));
 player.angle=normalizeAngle(player.angle+dx*.0025);
});

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==="r")reload();

 if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
  e.preventDefault();
 }

 if(e.code==="Space"&&!e.repeat)shoot();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousedown",e=>{
 if(e.button===0&&active&&locked)shoot();
});

// ---------------- PLAYER SHOOTING ----------------

function normalizeAngle(a){
 while(a>Math.PI)a-=Math.PI*2;
 while(a< -Math.PI)a+=Math.PI*2;
 return a;
}

function castRay(angle){
 // Exact grid DDA: advance from tile boundary to tile boundary rather than
 // sampling at fixed intervals. This keeps the perimeter walls geometrically
 // stable at every distance and angle.
 const dirX=Math.cos(angle);
 const dirY=Math.sin(angle);
 let mapX=Math.floor(player.x);
 let mapY=Math.floor(player.y);
 const deltaX=Math.abs(dirX)<1e-12?Infinity:Math.abs(1/dirX);
 const deltaY=Math.abs(dirY)<1e-12?Infinity:Math.abs(1/dirY);
 const stepX=dirX<0?-1:1;
 const stepY=dirY<0?-1:1;
 let sideX=(dirX<0?player.x-mapX:mapX+1-player.x)*deltaX;
 let sideY=(dirY<0?player.y-mapY:mapY+1-player.y)*deltaY;
 let side=0;
 let dist=0;
 let found=false;
 for(let i=0;i<MAPSIZE*4&&dist<DEPTH;i++){
  if(sideX<sideY){dist=sideX;sideX+=deltaX;mapX+=stepX;side=0;}
  else{dist=sideY;sideY+=deltaY;mapY+=stepY;side=1;}
  if(map[mapY]?.[mapX]!==0){found=true;break;}
 }
 if(!found)dist=DEPTH;
 return {
  dist,
  x:player.x+dirX*dist,
  y:player.y+dirY*dist,
  side,
  wallU:side===0?player.y+dirY*dist:player.x+dirX*dist
 };
}

function clearPath(x1,y1,x2,y2){
 const dx=x2-x1;
 const dy=y2-y1;
 const distance=Math.hypot(dx,dy);

 if(distance===0)return true;

 for(let d=.1;d<distance;d+=.12){
  if(wall(x1+dx/distance*d,y1+dy/distance*d))return false;
 }
 return true;
}

function shoot(){
 if(!active||betweenRounds||!locked||player.reloading)return;

 // Infinite ammo: shots do not consume ammunition.
 flash=.08;
 soundPlayerShot();

 let best=null;
 let bestAlong=Infinity;
 const shotAngle=player.angle;
 const shotEndX=player.x+Math.cos(shotAngle)*DEPTH;
 const shotEndY=player.y+Math.sin(shotAngle)*DEPTH;
 const wallDistance=castRay(shotAngle).dist;

 for(const bot of bots){
  if(!bot.alive)continue;
  const dx=bot.x-player.x, dy=bot.y-player.y;
  const along=dx*Math.cos(shotAngle)+dy*Math.sin(shotAngle);
  if(along<=0||along>=wallDistance+0.02||along>=bestAlong)continue;
  // Match collision to the exact on-screen square portrait bounds.
  // The shot is aimed at the screen centre, so it only hits when the
  // centre crosshair falls inside the same square that drawBots renders.
  const botAngle=normalizeAngle(Math.atan2(dy,dx)-player.angle);
  if(Math.abs(botAngle)>FOV*.75)continue;
  const screenX=W/2+Math.tan(botAngle)/Math.tan(FOV/2)*W/2;
  const spriteSize=Math.min(H*.58,H/(Math.hypot(dx,dy)*.88));
  const spriteY=H*.50-spriteSize*.04;
  const spriteLeft=screenX-spriteSize/2;
  const spriteTop=spriteY-spriteSize/2;
  const crosshairX=W/2, crosshairY=H/2;
  const insideSquare=crosshairX>=spriteLeft&&crosshairX<=spriteLeft+spriteSize&&
                     crosshairY>=spriteTop&&crosshairY<=spriteTop+spriteSize;
  if(insideSquare){best=bot;bestAlong=along;}
 }

 if(best){
  best.health-=34;
  best.hit=.15;

  paint.push({x:best.x,y:best.y,life:.8,color:"#ff4e8a"});

  if(best.health<=0){
   best.alive=false;
   score+=100;

   if(bots.every(b=>!b.alive)){
    startNextRound();
   }
  }
 }

 updateHUD();
}

// ---------------- PLAYER MOVEMENT ----------------

function movePlayer(dt){
 let forward=0;
 let side=0;

 // Arrow keys turn the camera left and right; WASD remains available for movement.
 const turnSpeed=2.5;
 if(keys.arrowleft)player.angle=normalizeAngle(player.angle-turnSpeed*dt);
 if(keys.arrowright)player.angle=normalizeAngle(player.angle+turnSpeed*dt);

 if(keys.w||keys.arrowup)forward++;
 if(keys.s||keys.arrowdown)forward--;
 if(keys.a)side--;
 if(keys.d)side++;

 const length=Math.hypot(forward,side);

 if(length>0){
  forward/=length;
  side/=length;
 }

 const speed=3.1*dt;

 const dx=(Math.cos(player.angle)*forward-
  Math.sin(player.angle)*side)*speed;

 const dy=(Math.sin(player.angle)*forward+
  Math.cos(player.angle)*side)*speed;

 if(!wall(player.x+dx+.18*Math.sign(dx),player.y))player.x+=dx;
 if(!wall(player.x,player.y+dy+.18*Math.sign(dy)))player.y+=dy;
}

// ---------------- CPU MOVEMENT AND SHOOTING ----------------

function updateBots(dt){
 contactDamageCooldown=Math.max(0,contactDamageCooldown-dt);

 for(const bot of bots){
  if(!bot.alive)continue;

  bot.hit=Math.max(0,bot.hit-dt);

  const dx=player.x-bot.x;
  const dy=player.y-bot.y;
  const dist=Math.hypot(dx,dy);

  bot.angle=Math.atan2(dy,dx);

  // Recalculate a shortest walkable route periodically. This lets zombies
  // navigate around obstacles and keep pursuing you even if you circle the map.
  bot.pathTimer-=dt;
  if(bot.pathTimer<=0){
   bot.pathTimer=.22;
   const sx=Math.floor(bot.x), sy=Math.floor(bot.y);
   const tx=Math.floor(player.x), ty=Math.floor(player.y);
   const total=MAPSIZE*MAPSIZE;
   const previous=new Int32Array(total);
   previous.fill(-1);
   const queue=new Int32Array(total);
   let head=0,tail=0;
   const startIndex=sy*MAPSIZE+sx;
   const targetIndex=ty*MAPSIZE+tx;
   queue[tail++]=startIndex;
   previous[startIndex]=startIndex;
   const steps=[[1,0],[-1,0],[0,1],[0,-1]];
   while(head<tail&&previous[targetIndex]===-1){
    const current=queue[head++];
    const cx=current%MAPSIZE, cy=Math.floor(current/MAPSIZE);
    for(const [ax,ay] of steps){
     const nx=cx+ax, ny=cy+ay;
     if(nx<=0||ny<=0||nx>=MAPSIZE-1||ny>=MAPSIZE-1||map[ny][nx])continue;
     const next=ny*MAPSIZE+nx;
     if(previous[next]!==-1)continue;
     previous[next]=current;
     queue[tail++]=next;
    }
   }
   if(previous[targetIndex]!==-1){
    let stepIndex=targetIndex;
    while(previous[stepIndex]!==startIndex&&stepIndex!==startIndex){
     stepIndex=previous[stepIndex];
    }
    bot.pathX=(stepIndex%MAPSIZE)+.5;
    bot.pathY=Math.floor(stepIndex/MAPSIZE)+.5;
   }else{
    bot.pathX=player.x;
    bot.pathY=player.y;
   }
  }

  if(dist>.72){
   const toX=bot.pathX-bot.x;
   const toY=bot.pathY-bot.y;
   const pathDist=Math.hypot(toX,toY);
   if(pathDist>.06){
    const step=Math.min(bot.speed*dt,pathDist);
    const nx=bot.x+(toX/pathDist)*step;
    const ny=bot.y+(toY/pathDist)*step;
    if(!wall(nx,bot.y))bot.x=nx;
    if(!wall(bot.x,ny))bot.y=ny;
   }
  }

  // Bots only hurt the player when they physically reach them.
  if(dist<=.82&&contactDamageCooldown<=0){
   player.health-=10;
   contactDamageCooldown=.65;
   hitVignette=.34;
   paint.push({x:player.x,y:player.y,life:.5,color:"#ff3333"});
   soundHit();
   updateHUD();

   if(player.health<=0){
    gameOver();
    return;
   }
  }
 }
}

// ---------------- GAME OVER ----------------

function gameOver(){
 active=false;
 betweenRounds=false;
 stopBotVoices();

 document.getElementById("roundBanner").style.display="none";
 document.exitPointerLock?.();

 // Keep the best score between matches on this device/browser.
 let highScore=0;
 try{
  highScore=Number(localStorage.getItem("kanyePaintballHighScore")||0);
  if(score>highScore){
   highScore=score;
   localStorage.setItem("kanyePaintballHighScore",String(highScore));
  }
 }catch(e){ highScore=score; }

 message.style.display="block";
 message.innerHTML=
  "<h1>GAME OVER</h1>"+
  "<p>High score: "+highScore+
  "<br>Final score: "+score+
  "<br>Rounds survived: "+round+"</p>"+
  "<button onclick='location.reload()'>PLAY AGAIN</button>";
}

// ---------------- UPDATES ----------------

function update(dt){
 if(!active||betweenRounds)return;

 movePlayer(dt);
 updateBots(dt);
 updateBotVoices();

 flash=Math.max(0,flash-dt);
 hitVignette=Math.max(0,hitVignette-dt);
 document.getElementById("hitVignette").style.opacity=hitVignette>0?String(Math.min(.9,hitVignette*2.4)):"0";

 for(const p of paint)p.life-=dt;
 paint=paint.filter(p=>p.life>0);

 // Infinite ammo: no automatic reload needed.
}

// ---------------- WORLD RENDERING ----------------

function drawWorld(){
 // Shared horizon keeps the ceiling, walls, and floor joined cleanly.
 const horizon=H*.50;
 const flicker=0.94+0.035*Math.sin(performance.now()*.006)+0.018*Math.sin(performance.now()*.017);

 // Solid Backrooms ceiling: one continuous surface with no grid, seams, or panels.
 const roof=ctx.createLinearGradient(0,0,0,horizon);
 roof.addColorStop(0,"#827b59");
 roof.addColorStop(.55,"#a69b70");
 roof.addColorStop(1,"#c5b987");
 ctx.fillStyle=roof;
 ctx.fillRect(0,0,W,horizon);

 // Restore a clearly visible floor across the entire area below the horizon.
 const floor=ctx.createLinearGradient(0,horizon,0,H);
 floor.addColorStop(0,"#aaa078");
 floor.addColorStop(.45,"#82794f");
 floor.addColorStop(1,"#625b3d");
 ctx.fillStyle=floor;
 ctx.fillRect(0,horizon,W,H-horizon);

 // Solid Backrooms carpet/concrete floor: no grid, tiles, or perspective lines.
 // Broad low-contrast shading keeps the surface readable without looking like a grid.
 const floorGlow=ctx.createRadialGradient(W*.52,H*.68,10,W*.52,H*.68,H*.62);
 floorGlow.addColorStop(0,"rgba(190,166,105,.10)");
 floorGlow.addColorStop(1,"rgba(30,28,19,.10)");
 ctx.fillStyle=floorGlow;
 ctx.fillRect(0,horizon,W,H-horizon);

 // Very faint floor reference lines are fixed to world-space tile coordinates.
 // They provide motion/parallax cues without changing the solid floor surface.
 ctx.save();
 ctx.strokeStyle="rgba(52,45,29,.13)";
 ctx.lineWidth=1;
 const projectGround=(wx,wy)=>{
  const dx=wx-player.x, dy=wy-player.y;
  const forward=dx*Math.cos(player.angle)+dy*Math.sin(player.angle);
  if(forward<=.35)return null;
  const lateral=-dx*Math.sin(player.angle)+dy*Math.cos(player.angle);
  const screenX=W*.5+(lateral/(forward*Math.tan(FOV*.5)))*(W*.5);
  const screenY=horizon+(H*.34/forward);
  return {x:screenX,y:screenY};
 };
 const drawGroundSegment=(x1,y1,x2,y2)=>{
  const a=projectGround(x1,y1), b=projectGround(x2,y2);
  if(!a||!b||a.y<horizon||b.y<horizon)return;
  if((a.x<0&&b.x<0)||(a.x>W&&b.x>W)||a.y>H*2||b.y>H*2)return;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 };
 for(let gx=4;gx<MAPSIZE;gx+=4){
  for(let gy=0;gy<MAPSIZE;gy+=.5)drawGroundSegment(gx,gy,gx,Math.min(MAPSIZE,gy+.5));
 }
 for(let gy=4;gy<MAPSIZE;gy+=4){
  for(let gx=0;gx<MAPSIZE;gx+=.5)drawGroundSegment(gx,gy,Math.min(MAPSIZE,gx+.5),gy);
 }
 ctx.restore();

 // Rebuilt wall renderer: one precise ray per screen column, with exact
 // grid intersections. No camera-space wall stretching or approximate hits.
 for(let x=0;x<W;x++){
  const cameraX=(2*(x+.5)/W)-1;
  const rayAngle=player.angle+Math.atan(cameraX*Math.tan(FOV*.5));
  const hit=castRay(rayAngle);
  const corrected=Math.max(.08,hit.dist*Math.cos(rayAngle-player.angle));
  const wallHeight=Math.min(H*2,H/(corrected*.75));
  const top=horizon-wallHeight*.5;
  const sideShade=hit.side===1?.78:1;
  const distanceShade=Math.max(.42,1-corrected/48);
  const tileU=hit.wallU-Math.floor(hit.wallU);
  const verticalTexture=.94+.06*Math.sin(tileU*Math.PI*2);
  const base= Math.max(.25,sideShade*distanceShade*verticalTexture);
  const r=Math.round(166*base),g=Math.round(151*base),b=Math.round(105*base);
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillRect(x,top,1,wallHeight);

  // A faint vertical edge at each world-tile boundary adds depth cues while
  // remaining attached to the wall itself. No horizontal bands or floor lines.
  const edge=Math.min(tileU,1-tileU);
  if(edge<.025){
   ctx.fillStyle='rgba(35,29,17,.16)';
   ctx.fillRect(x,top,1,wallHeight);
  }
 }

 // Lantern-like amber pools of light with a restrained irregular flicker.
 ctx.save();
 ctx.globalCompositeOperation="screen";
 const lanterns=[W*.12,W*.5,W*.88];
 lanterns.forEach((lx,i)=>{
  const pulse=flicker+(i===1?.025:0);
  const glow=ctx.createRadialGradient(lx,horizon*.72,2,lx,horizon*.72,Math.max(W*.22,150));
  glow.addColorStop(0,`rgba(255,190,92,${.16*pulse})`);
  glow.addColorStop(.42,`rgba(255,165,75,${.075*pulse})`);
  glow.addColorStop(1,"rgba(255,150,55,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 });
 // A low-level warm fill prevents dark corners and keeps targets readable.
 const ambient=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.78);
 ambient.addColorStop(0,"rgba(255,205,130,.075)");
 ambient.addColorStop(1,"rgba(255,175,90,.025)");
 ctx.fillStyle=ambient;ctx.fillRect(0,0,W,H);
 ctx.restore();
}

// ---------------- SQUARE KANYE CPU PICTURES ----------------

function drawBots(){
 const visible=bots.filter(b=>b.alive).map(bot=>{
  const dx=bot.x-player.x;
  const dy=bot.y-player.y;

  return {
   ...bot,
   dist:Math.hypot(dx,dy),
   angle:normalizeAngle(Math.atan2(dy,dx)-player.angle)
  };
 }).sort((a,b)=>b.dist-a.dist);

 for(const bot of visible){
  if(Math.abs(bot.angle)>FOV*.75)continue;

  const ray=castRay(player.angle+bot.angle);
  if(ray.dist<bot.dist-.25)continue;

  const sx=W/2+Math.tan(bot.angle)/Math.tan(FOV/2)*W/2;
  const size=Math.min(H*.58,H/(bot.dist*.88));
  const sy=H*.50-size*.04;

  const left=sx-size/2;
  const top=sy-size/2;

  ctx.save();

  if(kanyeImg.complete&&kanyeImg.naturalWidth>0){
   ctx.imageSmoothingEnabled=true;
   ctx.drawImage(pixelPortrait,left,top,size,size);
  }else{
   // Plain dark tile while the portrait loads; no checkerboard or text.
   ctx.fillStyle="#263849";
   ctx.fillRect(left,top,size,size);
  }

  ctx.fillStyle="#111";
  ctx.fillRect(left,top-size*.12,size,size*.055);

  ctx.fillStyle="#43e46d";
  ctx.fillRect(left,top-size*.12,size*Math.max(0,bot.health/100),size*.055);

  ctx.restore();
 }
}

// ---------------- PLAYER MARKER ----------------

function drawWeapon(){
 const x=W/2;
 const y=H;

 ctx.fillStyle="#17232b";
 ctx.beginPath();
 ctx.moveTo(x-65,y);
 ctx.lineTo(x-35,y-100);
 ctx.lineTo(x+35,y-100);
 ctx.lineTo(x+65,y);
 ctx.fill();

 ctx.fillStyle="#394d59";
 ctx.fillRect(x-17,y-155,34,95);

 ctx.fillStyle="#18232a";
 ctx.fillRect(x-9,y-180,18,65);

 ctx.fillStyle="#71818a";
 ctx.fillRect(x-4,y-180,8,25);

 if(flash>0){
  ctx.fillStyle="#ffdc68";
  ctx.beginPath();
  ctx.arc(x,y-183,20+Math.random()*10,0,Math.PI*2);
  ctx.fill();
 }
}

// ---------------- MINIMAP ----------------

function drawMinimap(){
 mctx.clearRect(0,0,160,160);

 const cell=160/MAPSIZE;

 for(let y=0;y<MAPSIZE;y++){
  for(let x=0;x<MAPSIZE;x++){
   mctx.fillStyle=map[y][x]?"#b9a64e":"#514d2c";
   mctx.fillRect(x*cell,y*cell,cell-.5,cell-.5);
  }
 }

 for(const b of bots){
  if(!b.alive)continue;

  mctx.fillStyle="#ff5548";
  mctx.beginPath();
  mctx.arc(b.x*cell,b.y*cell,Math.max(1.5,cell*.32),0,Math.PI*2);
  mctx.fill();
 }

 mctx.fillStyle="#54dfff";
 mctx.beginPath();
 mctx.arc(player.x*cell,player.y*cell,Math.max(2,cell*.38),0,Math.PI*2);
 mctx.fill();

 mctx.strokeStyle="#54dfff";
 mctx.beginPath();
 mctx.moveTo(player.x*cell,player.y*cell);
 mctx.lineTo(
  (player.x+Math.cos(player.angle)*1.5)*cell,
  (player.y+Math.sin(player.angle)*1.5)*cell
 );
 mctx.stroke();
}

function draw(){
 drawWorld();
 drawBots();
 drawWeapon();
 drawMinimap();
}

// ---------------- MAIN LOOP ----------------

function gameLoop(time){
 if(!active)return;

 const dt=Math.min((time-lastTime)/1000,.05);
 lastTime=time;

 update(dt);
 draw();

 requestAnimationFrame(gameLoop);
}

// Initial scene
makeMap();
spawnBots();
draw();

</script>
